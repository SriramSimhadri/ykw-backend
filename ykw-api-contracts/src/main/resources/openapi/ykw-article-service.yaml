openapi: 3.0.3

info:
  title: YKW Article Service
  version: 1.1.0
  description: API for managing articles, tags, and feeds

tags:
  - name: Articles
    description: Article management APIs
  - name: Tags
    description: Tag management APIs
  - name: Feed
    description: Personalized feed APIs

servers:
  - url: http://localhost:8092

paths:
  /api/articles:
    post:
      tags:
        - Articles
      summary: Create a new article
      operationId: createArticle
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateArticleRequest'
      responses:
        '201':
          description: Article created successfully
          headers:
            Location:
              description: URL of created article
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

    get:
      tags:
        - Articles
      summary: Get all articles (with filters)
      operationId: listArticles
      parameters:
        - name: authorId
          in: query
          schema:
            type: integer
            format: int64
        - name: tag
          in: query
          schema:
            type: string
        - name: q
          in: query
          description: Search keyword
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ArticleStatus'
        - name: sort
          in: query
          schema:
            type: string
            example: "publishedAt,desc"
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated articles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedArticleResponse'

  /api/articles/{slug}:
    get:
      tags:
        - Articles
      summary: Get article by slug
      operationId: getArticleBySlug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Article details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleResponse'
        '404':
          description: Article not found

    put:
      tags:
        - Articles
      summary: Update an article
      operationId: updateArticle
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateArticleRequest'
      responses:
        '200':
          description: Article updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden (not the author)
        '404':
          description: Article not found

    delete:
      tags:
        - Articles
      summary: Delete an article
      operationId: deleteArticle
      security:
        - bearerAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Article deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden (not the author)
        '404':
          description: Article not found

  /api/articles/feed:
    get:
      tags:
        - Feed
      summary: Get personalized feed for current user
      operationId: getFeed
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Personalized feed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedArticleResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/articles/{slug}/tags:
    post:
      tags:
        - Tags
      summary: Add tags to an article
      operationId: addTags
      security:
        - bearerAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddTagsRequest'
      responses:
        '200':
          description: Tags added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleResponse'

  /api/articles/{slug}/tags/{tagName}:
    delete:
      tags:
        - Tags
      summary: Remove a tag from an article
      operationId: removeTag
      security:
        - bearerAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: tagName
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Tag removed successfully

  /api/tags:
    get:
      tags:
        - Tags
      summary: Get all tags
      operationId: listTags
      responses:
        '200':
          description: List of tags
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagListResponse'

components:

  parameters:
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique key to ensure idempotent request handling
      schema:
        type: string

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:

    CreateArticleRequest:
      type: object
      required: [title, content, status]
      properties:
        title:
          type: string
          maxLength: 255
        subtitle:
          type: string
          maxLength: 500
        content:
          type: string
        status:
          $ref: '#/components/schemas/ArticleStatus'
        coverImageUrl:
          type: string

    UpdateArticleRequest:
      type: object
      properties:
        articleId:
          type: string
          maxLength: 255
        title:
          type: string
          maxLength: 255
        subtitle:
          type: string
          maxLength: 500
        content:
          type: string
        status:
          $ref: '#/components/schemas/ArticleStatus'
        coverImageUrl:
          type: string

    ArticleResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        slug:
          type: string
        author:
          $ref: '#/components/schemas/AuthorSummary'
        title:
          type: string
        subtitle:
          type: string
        content:
          type: string
        status:
          $ref: '#/components/schemas/ArticleStatus'
        coverImageUrl:
          type: string
        readingTime:
          type: integer
        tags:
          type: array
          items:
            type: string
        publishedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AuthorSummary:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        profileImageUrl:
          type: string

    PagedArticleResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ArticleResponse'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
        totalPages:
          type: integer

    AddTagsRequest:
      type: object
      properties:
        tags:
          type: array
          items:
            type: string

    TagListResponse:
      type: object
      properties:
        tags:
          type: array
          items:
            type: string

    ArticleStatus:
      type: string
      enum: [DRAFT, PUBLISHED, DELETED]

    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        path:
          type: string