spring:

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 20 # Max db concurrent connections
      minimum-idle: 5 # keep 5 ready connections
      connection-timeout: 3000 # wait max 3 seconds
      idle-timeout: 600000 # close idle connections
      max-lifetime: 1800000 # kill long-lived connections

  jpa:
    hibernate:
      ddl-auto: validate
    database: postgresql
    show-sql: ${JPA_SHOW_SQL:true}

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: public

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      timeout: 2000
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2
          timeout: 2000